<circle cx="352" cy="110" r="13" fill="#1f2731"/><text x="352" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="78" cy="269" r="13" fill="#1f2731"/><text x="78" y="274" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="436" cy="278" r="13" fill="#1f2731"/><text x="436" y="283" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="283" cy="531" r="13" fill="#1f2731"/><text x="283" y="536" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="603" cy="130" r="13" fill="#1f2731"/><text x="603" y="135" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="628" y="135" font-size="16" font-weight="700" fill="#1f2731">Spring latch, normally locked</text>
<text x="628" y="158" font-size="13.5" fill="#6b7785">Drops into one of 12 indexing notches. A</text>
<text x="628" y="177" font-size="13.5" fill="#6b7785">hand lifts it to release; on power loss it</text>
<text x="628" y="196" font-size="13.5" fill="#6b7785">stays locked.</text>
<circle cx="603" cy="230" r="13" fill="#1f2731"/><text x="603" y="235" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="628" y="235" font-size="16" font-weight="700" fill="#1f2731">Hand pushes a peg</text>
<text x="628" y="258" font-size="13.5" fill="#6b7785">Pegs on the hub give a positive grip; no</text>
<text x="628" y="277" font-size="13.5" fill="#6b7785">friction rim. Push, release, take the next</text>
<text x="628" y="296" font-size="13.5" fill="#6b7785">peg.</text>
<circle cx="603" cy="330" r="13" fill="#1f2731"/><text x="603" y="335" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="628" y="335" font-size="16" font-weight="700" fill="#1f2731">Ratchet and pawl</text>
<text x="628" y="358" font-size="13.5" fill="#6b7785">Lets the reel turn forward only, so it</text>
<text x="628" y="377" font-size="13.5" fill="#6b7785">cannot roll back while the hand re-grips.</text>
<circle cx="603" cy="430" r="13" fill="#1f2731"/><text x="603" y="435" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="628" y="435" font-size="16" font-weight="700" fill="#1f2731">Forward rotation</text>
<text x="628" y="458" font-size="13.5" fill="#6b7785">One position per peg. Tube N is brought to</text>
<text x="628" y="477" font-size="13.5" fill="#6b7785">the arms in (N - current) mod 12 steps.</text>
<text x="32" y="580" font-size="12" fill="#6b7785">robotarm-lab · docs/design/reel-indexing.md</text>
</svg>